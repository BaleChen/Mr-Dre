[project]
name = "mrdre"
version = "0.1.0"
description = "Mr Dre: evaluating how deep research agents revise their reports across turns"
readme = "README.md"
dependencies = [
    "diskcache==5.6.3",
    "openai==2.15.0",
    "python-dotenv==1.2.1",
    "requests==2.32.5",
    "tenacity==9.1.2",
    "tqdm==4.67.1",
    "typing-extensions==4.15.0",
]

[project.optional-dependencies]
# Serving a local model for the reviser agent
serve = ["vllm>=0.13.0"]

[project.scripts]
mrdre = "mrdre.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mrdre*"]
